name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      # Harness self-test: the oracle must score 100% on v2 against the offline benchmark repos.
      - run: python eval/run_eval.py --fake-github --backend oracle --toolset v2 --min-correct 100
